name: GigLizard Social Autopilot

on:
  schedule:
    # Runs every morning at 8:00 AM EDT (12:00 UTC)
    # To adjust for a different time zone (e.g., 8:00 AM PDT / 15:00 UTC), adjust the hour value
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (print post without queuing to Buffer)'
        required: false
        default: 'false'
        type: boolean

jobs:
  venue-autopilot:
    name: Pull Venue, Generate Tip & Buffer Post
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit

      - name: Run Autopilot Bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://papzanzgzoghrrgdzvfo.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID || secrets.BUFFER_PROFILE_ID }}
          BUFFER_PROFILE_ID: ${{ secrets.BUFFER_PROFILE_ID || secrets.BUFFER_CHANNEL_ID }}
          FALLBACK_MEDIA_URL: ${{ secrets.FALLBACK_MEDIA_URL || 'https://giglizard.us/og-image.png' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node bot.mjs
