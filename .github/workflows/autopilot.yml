name: GigLizard Social Autopilot

on:
  schedule:
    # Runs every morning at 8:00 AM EDT (12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (print post without queuing to Buffer)'
        required: false
        default: 'false'
        type: boolean
      mode:
        description: 'Execution mode (auto, primary, or daily_credits)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - primary
          - daily_credits

jobs:
  venue-autopilot:
    name: Autonomous Venue Spotlight & Day-of-Week Touring Task
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit

      - name: Run Autopilot Bot (Primary Mode)
        id: autopilot-run
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://papzanzgzoghrrgdzvfo.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID || secrets.BUFFER_PROFILE_ID }}
          BUFFER_PROFILE_ID: ${{ secrets.BUFFER_PROFILE_ID || secrets.BUFFER_CHANNEL_ID }}
          FALLBACK_MEDIA_URL: ${{ secrets.FALLBACK_MEDIA_URL || 'https://giglizard.us/og-image.png' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FORCE_DAILY_CREDITS: ${{ github.event.inputs.mode == 'daily_credits' && 'true' || 'false' }}
        run: node bot.mjs

      - name: Autonomous Failover to Daily Credits (Guarantees 100% Autonomous Execution)
        if: steps.autopilot-run.outcome == 'failure'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://papzanzgzoghrrgdzvfo.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID || secrets.BUFFER_PROFILE_ID }}
          FALLBACK_MEDIA_URL: ${{ secrets.FALLBACK_MEDIA_URL || 'https://giglizard.us/og-image.png' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FORCE_DAILY_CREDITS: 'true'
        run: |
          echo "⚠️ Primary task encountered an error. Automatically switching to Daily Credits mode..."
          node bot.mjs --daily-credits
