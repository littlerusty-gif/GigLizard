        <h1>GigLizard: Free Stage Plot Maker, Tech Rider Builder & Live Music Venue Directory</h1>
        <p>GigLizard is the all-in-one free digital stage and touring toolkit built for independent musicians, bands, sound engineers, and venue talent buyers across the United States. Create professional stage plots, build 24-channel live sound tech riders, explore 650+ verified music venues across 48 states, route multi-city tours with Google Maps gas estimators, and generate vintage gig flyers with zero monthly subscription fees.</p>
        
        <h2>1. Free Drag-and-Drop Stage Plot Designer & Maker (<a href="/plot" style="color: #4f46e5;">Open Stage Plot Tool</a>)</h2>
        <p>Build professional visual stage plots for free online with instant 300 DPI high-resolution PDF and PNG export:</p>
        <ul>
          <li><strong>Single Kick &amp; Dual Kick Drum Kits:</strong> Choose realistic drum kit setups with elevated concert risers, black heads, teal shells, and high boom cymbals.</li>
          <li><strong>Floor Monitor Wedges &amp; In-Ear Monitors:</strong> Place single 12" wedges or dual wedges with customized OUT mix send numbers (e.g., OUT 1 Lead Vocal, OUT 2 Guitar). Written rider specs dynamically reflect the exact physical monitor count placed on stage.</li>
          <li><strong>Amplifiers &amp; Direct Inputs:</strong> Position 4x12 guitar half stacks, combo amps, 8x10 bass rigs, active DI boxes, and keyboard synthesizers.</li>
          <li><strong>Vocal Microphones &amp; Boom Stands:</strong> Label downstage center, stage left, and stage right lead and backing vocal positions.</li>
          <li><strong>Export for Sound Engineers:</strong> Print-ready 300 DPI technical spec sheet formatted with visual layout, channel patch list, power drops, and stage contact info.</li>
        </ul>

        <h2>2. Live Soundboard Tech Rider Builder (<a href="/rider" style="color: #4f46e5;">Open Tech Rider Tool</a>)</h2>
        <p>Generate industry-standard input patch lists and technical riders ready for front-of-house (FOH) and monitor sound engineers:</p>
        <ul>
          <li><strong>24-Channel Input Patch Matrix:</strong> Channel assignment, instrument description, microphone/DI preferences (Shure SM57, Beta 52, Active DI), and stand heights.</li>
          <li><strong>Phantom Power (+48V) &amp; Comp Routing:</strong> Flag condenser mics and DI boxes requiring phantom power and specify compression/reverb preferences.</li>
          <li><strong>Front-of-House PA Specifications:</strong> Define required PA pressure (minimum 90 dB clean across audience), monitor mix sends, and AC power drop requirements.</li>
        </ul>

        <h2>3. 650+ Live Music Venue Directory (<a href="/venues" style="color: #4f46e5;">Browse Venues</a>)</h2>
        <p>Discover independent music venues, clubs, historic theaters, and listening rooms across all 48 continental states for 100% free:</p>
        <ul>
          <li><strong>Filter by City &amp; Genre:</strong> Search rooms in Portland, Seattle, Austin, Nashville, Chicago, Los Angeles, New York, Denver, and hundreds more.</li>
          <li><strong>Direct Booking Contacts:</strong> Access human-verified talent buyer booking emails, submission requirements, and venue age policies (21+, 18+, All Ages).</li>
          <li><strong>Production Specs:</strong> View room capacity, stage dimensions, installed sound systems, and backline availability before reaching out.</li>
        </ul>

        <h2>4. DIY Band Tour Route Planner &amp; Van Gas Calculator (<a href="/tour" style="color: #4f46e5;">Open Tour Planner</a>)</h2>
        <p>Plot multi-city touring runs with intelligent driving corridors and budget calculations powered by Google Maps:</p>
        <ul>
          <li><strong>Highway Corridor Optimization:</strong> Plan realistic drive times between tour stops to avoid 12-hour overnight drives.</li>
          <li><strong>Band Van Fuel Cost Estimator:</strong> Accurate gas expense forecasts based on MPG and regional fuel prices.</li>
          <li><strong>Lodging &amp; Day-of-Show Timelines:</strong> Track hotel stays, load-in, soundcheck, doors, and set times for your entire crew.</li>
        </ul>

        <h2>5. Concert Poster Designer &amp; Gig Flyer Studio (<a href="/poster" style="color: #4f46e5;">Open Poster Studio</a>)</h2>
        <p>Design vintage concert flyers and tour promotional artwork in seconds:</p>
        <ul>
          <li><strong>Aesthetic Themes:</strong> Vintage 1970s halftone print, 1990s grunge photocopier, psychedelic screenprint, and neon cyber club styles.</li>
          <li><strong>Instant Export:</strong> Download 300 DPI print-ready PDFs for street postering and optimized PNGs for Instagram, Facebook, and venue promo.</li>
        </ul>

        <h2>6. 4,850+ Touring Bands Co-Bill Directory (<a href="/bands" style="color: #4f46e5;">Find Bands</a>)</h2>
        <p>Connect with active touring and local support bands in every US market to split venue guarantees, share backline gear, and draw bigger crowds.</p>

        <h2>Transparent Musician Pricing • Never Any Subscriptions</h2>
        <p><strong>100% Free Core Tools:</strong> Venue Search, Stage Plot Designer, Tech Rider Builder, Tour Planner, and Poster Studio are free forever with no credit card required.</p>
        <p><strong>30-Day Band Directory Contacts Pass:</strong> $9.99 flat fee (+$0.84 processor fee = $10.83 total) for 30 days of direct booking email access with zero recurring billing. Backed by a 7-day 100% money-back artist satisfaction guarantee.</p>

        <h2>Founded by Musicians, for Musicians</h2>

        <!-- Animated emerald loading dots cleanly positioned below badge -->
        <div style="margin-top: 28px; display: flex; flex-direction: column; align-items: center; gap: 10px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="loading-dot dot-1" style="width: 8px; height: 8px; border-radius: 9999px; background-color: #10b981; animation: dotBounce 1.4s infinite ease-in-out both;"></span>
            <span class="loading-dot dot-2" style="width: 8px; height: 8px; border-radius: 9999px; background-color: #34d399; animation: dotBounce 1.4s infinite ease-in-out both; animation-delay: 0.2s;"></span>
            <span class="loading-dot dot-3" style="width: 8px; height: 8px; border-radius: 9999px; background-color: #6ee7b7; animation: dotBounce 1.4s infinite ease-in-out both; animation-delay: 0.4s;"></span>
          </div>
          <span style="color: #94a3b8; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;">Loading GigLizard</span>
        </div>
      </div>
      <style>
        @media (min-width: 768px) {
          .emblem-circle {
            width: 500px !important;
            max-width: 500px !important;
            height: 500px !important;
            max-height: 500px !important;
          }
        }
        @keyframes haloGlow {
          0% { transform: scale(0.96); opacity: 0.6; }
          100% { transform: scale(1.06); opacity: 1; }
        }
        @keyframes dotBounce {
          0%, 80%, 100% { transform: scale(0.6); opacity: 0.35; }
          40% { transform: scale(1.25); opacity: 1; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
