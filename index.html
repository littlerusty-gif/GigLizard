<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>GigLizard</title>
    <meta name="description" content="GigLizard: Live music booking directories, AI tour routing, custom stage plots, tech riders, and concert poster designs for independent bands and venues." />
    <meta property="og:title" content="GigLizard" />
    <meta property="og:description" content="Live music booking directories, AI tour routing, custom stage plots, tech riders, and concert poster designs for independent bands and venues." />
    <meta property="og:image" content="/giglizard_logo.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/giglizard_logo.png" />
  </head>
  <body class="bg-slate-900">
    <div id="root">
      <!-- Fast-paint native splash screen with centered circular glowing emblem -->
      <div id="initial-app-splash" style="position: fixed; inset: 0; background-color: #121212; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; padding: 20px;">
        <div class="emblem-wrapper" style="position: relative; display: flex; align-items: center; justify-content: center;">
          <!-- Subtle emerald pulsing glow perimeter halo -->
          <div class="emblem-pulse-halo" style="position: absolute; inset: -6px; border-radius: 9999px; background: radial-gradient(circle, rgba(16,185,129,0.4) 0%, rgba(5,150,105,0.18) 70%, transparent 100%); filter: blur(14px); animation: haloGlow 2.5s ease-in-out infinite alternate;"></div>
          
          <!-- Inner circle container (mobile: w-[85vw] max-w-[360px] aspect-square; desktop: max-w-[500px] aspect-square) -->
          <div class="emblem-circle" style="position: relative; width: 85vw; max-width: 360px; height: 85vw; max-height: 360px; aspect-ratio: 1 / 1; border-radius: 9999px; overflow: hidden; box-shadow: 0 0 45px rgba(16,185,129,0.5), 0 0 90px rgba(5,150,105,0.25); border: 2.5px solid rgba(16,185,129,0.7); background-color: #121212; display: flex; align-items: center; justify-content: center;">
            <img 
              src="/icon-512.png" 
              alt="GigLizard: The Ultimate Live Music Stage Director" 
              class="emblem-image"
              style="width: 100%; height: 100%; object-fit: contain; display: block;"
            />
          </div>
        </div>

        <!-- Animated emerald loading dots cleanly positioned below badge -->
        <div style="margin-top: 28px; display: flex; flex-direction: column; align-items: center; gap: 10px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="loading-dot dot-1" style="width: 8px; height: 8px; border-radius: 9999px; background-color: #10b981; animation: dotBounce 1.4s infinite ease-in-out both;"></span>
            <span class="loading-dot dot-2" style="width: 8px; height: 8px; border-radius: 9999px; background-color: #34d399; animation: dotBounce 1.4s infinite ease-in-out both; animation-delay: 0.2s;"></span>
            <span class="loading-dot dot-3" style="width: 8px; height: 8px; border-radius: 9999px; background-color: #6ee7b7; animation: dotBounce 1.4s infinite ease-in-out both; animation-delay: 0.4s;"></span>
          </div>
          <span style="color: #94a3b8; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;">Loading GigLizard</span>
        </div>
      </div>
      <style>
        @media (min-width: 768px) {
          .emblem-circle {
            width: 500px !important;
            max-width: 500px !important;
            height: 500px !important;
            max-height: 500px !important;
          }
        }
        @keyframes haloGlow {
          0% { transform: scale(0.96); opacity: 0.6; }
          100% { transform: scale(1.06); opacity: 1; }
        }
        @keyframes dotBounce {
          0%, 80%, 100% { transform: scale(0.6); opacity: 0.35; }
          40% { transform: scale(1.25); opacity: 1; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
