<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10b981" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GigLizard</title>
    <meta name="description" content="GigLizard: Live music booking directories, AI tour routing, custom stage plots, tech riders, and concert poster designs for independent bands and venues." />
    <meta property="og:title" content="GigLizard" />
    <meta property="og:description" content="Live music booking directories, AI tour routing, custom stage plots, tech riders, and concert poster designs for independent bands and venues." />
    <meta property="og:image" content="/giglizard_logo.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/giglizard_logo.png" />
  </head>
  <body class="bg-slate-900">
    <div id="root">
      <!-- Fast-paint native splash screen with generous safe-area padding -->
      <div id="initial-app-splash" style="position: fixed; inset: 0; background-color: #121212; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; padding: 24px;">
        <div class="splash-container" style="width: 100%; max-width: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px;">
          <img 
            src="/icon-512.png" 
            alt="GigLizard" 
            class="splash-logo"
            style="width: 100%; max-width: 65vw; height: auto; object-fit: contain; margin: 0 auto; filter: drop-shadow(0 10px 25px rgba(0,0,0,0.5));"
          />
          <div style="margin-top: 24px; display: flex; align-items: center; gap: 8px;">
            <div style="width: 8px; height: 8px; border-radius: 9999px; background-color: #10b981; animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;"></div>
            <span style="color: #94a3b8; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;">Loading GigLizard...</span>
          </div>
        </div>
      </div>
      <style>
        @media (min-width: 768px) {
          .splash-container { max-width: 420px !important; }
          .splash-logo { max-width: 420px !important; }
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.4; transform: scale(0.85); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
